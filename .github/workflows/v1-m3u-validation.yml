name: V1 M3U validation
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/v1-m3u-validation.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node supabase/functions/import-m3u/import.test.mjs
