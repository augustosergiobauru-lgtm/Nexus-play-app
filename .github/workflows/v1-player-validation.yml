name: V1 dual player validation
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/v1-player-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile APK and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare screenshot directory
        run: mkdir -p home-screenshots
      - name: Exercise Exo and VLC on public MP4 and HLS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace && adb pull /sdcard/Download/nexus-home-landscape.png home-screenshots/
      - name: Upload home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Home-Screenshot
          path: home-screenshots/
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Play-V1-dual-player
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V1-player-validation-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
